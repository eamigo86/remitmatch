[package]
name = "remitmatch"
description = "Match bank payments to open invoices (1:1, 1:N, N:1) and explain every match with a per-signal score."
readme = "../../README.md"
keywords = ["reconciliation", "invoices", "payments", "fintech", "pyo3"]
categories = ["finance", "algorithms"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aho-corasick = "1"
chrono = { version = "0.4.45", default-features = false }
strsim = "0.11"
unicode-normalization = "0.1"

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

[[bench]]
name = "reconcile"
harness = false
