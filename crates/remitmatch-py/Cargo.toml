[package]
name = "remitmatch-py"
description = "PyO3 bindings for remitmatch."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]
# No Rust tests live here; skipping them avoids linking libpython in test binaries.
test = false
doctest = false

[dependencies]
remitmatch = { path = "../remitmatch" }
pyo3 = { version = "0.30.1", features = ["abi3-py310", "chrono"] }
chrono = { version = "0.4.45", default-features = false }
# Arrow input through the PyCapsule interface; the default buffer_protocol feature is off.
pyo3-arrow = { version = "0.21", default-features = false }
arrow-array = "60.1"
arrow-cast = "60.1"
arrow-schema = "60.1"

[lints]
workspace = true
